name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests/v2
      - run: uv run pytest -q
      - run: uv run rfig render examples/v2/figure.contract.yaml
      - run: uv run rfig preflight examples/v2/outputs/Fig1/Fig1.pdf --contract examples/v2/figure.contract.yaml
