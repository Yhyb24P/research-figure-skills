name: release-dry-run

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish through configured OIDC trusted publishers'
        required: true
        default: false
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/check_versions.py
      - run: uv run python scripts/check_case_collisions.py
      - run: uv run python scripts/sync_skills.py --check
      - run: uv run python scripts/sync_licenses.py --check
      - run: uv build --no-sources
      - run: uv run python scripts/test_wheel.py
      - run: uv run python scripts/build_native.py --platform linux-x64
      - run: uv run python scripts/package_npm.py
      - run: npm pack --workspace @yhyb24p/research-figure --dry-run
      - run: uv run python scripts/release_dry_run.py
      - uses: actions/upload-artifact@v4
        with: {name: release-artifacts, path: dist/}
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: 'dist/**'}

  publish-pypi:
    needs: release-dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions: {id-token: write}
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: {name: release-artifacts, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: release-dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: release-artifacts, path: dist}
      - uses: actions/setup-node@v4
        with: {node-version: 20, registry-url: 'https://registry.npmjs.org'}
      - run: npm publish dist/npm/yhyb24p-research-figure-linux-x64-2.1.0-rc.1.tgz --provenance --access public --tag next
      - run: npm publish dist/npm/yhyb24p-research-figure-2.1.0-rc.1.tgz --provenance --access public --tag next
